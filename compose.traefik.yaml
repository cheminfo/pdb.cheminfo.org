# Traefik reverse-proxy deployment — requires an external Docker network
# named `traefik` with a `websecure` entrypoint and `letsencrypt` cert resolver.
#
# Adjust the Host(...) label to your hostname (default: pdb.cheminfo.org).
# Select this mode with COMPOSE_FILE=compose.traefik.yaml in .env, then run:
#   docker compose up -d
services:
  node-pdb-sync:
    # healthcheck-ok: a cron worker: it mirrors the PDB and serves no HTTP to probe.
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/pdb.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    volumes:
      - ./data:/app/data:z
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: '*'
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # docker-entrypoint.sh runs as root to fix ownership of the bind-mounted
      # /app/data (CHOWN + DAC_OVERRIDE + FOWNER), then drops to the `app` user
      # via gosu (SETUID + SETGID). Everything else stays dropped.
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      # Required by read_only: pymol writes the source .pdb and the rendered
      # .png under /tmp, and npm needs a writable HOME for its cache.
      - /tmp:mode=1777,size=1g
      - /home/app:mode=0777,size=64m
    # PyMol hard-caps concurrent processes at min(PYMOL_CONCURRENCY, 8).
    # Each child spawns ~15 OS threads (Python + OpenMP), so the worst case
    # is 8 × 15 = 120 PyMol threads + ~30 Node threads ≈ 150 total PIDs —
    # well within 1024.
    pids_limit: 1024
    # 16 GB covers 8 simultaneous PyMol renders (≈ 500 MB each) plus
    # headroom for Node, rsync, and chokidar.
    mem_limit: ${PYMOL_MEMORY_LIMIT:-16g}
    memswap_limit: ${PYMOL_MEMORY_LIMIT:-16g}
    cpus: ${PYMOL_CPU_LIMIT:-8}
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron

  pdb-api:
    # Fastify server: HTTP API (substructure search, parsed PDB metadata,
    # stats aggregates, raw file streaming) AND the React/Vite bundle baked
    # into the image at /app/backend/public. Traefik routes everything
    # straight here — no separate nginx hop. On first start it seeds
    # data/sqlite/db.sqlite from the wwPDB Chemical Component Dictionary
    # if the `ligands` table is empty.
    # Use the released image by default. To build locally instead, run:
    #   docker compose up -d --build
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/pdb.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    # What the server's deploy script probes before it keeps a new container.
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:31015/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./data:/app/data:z
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: '*'
      PORT: '31015'
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Same root-then-gosu entrypoint as node-pdb-sync (see above).
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      # The on-demand repair endpoint renders through pymol, which writes to
      # /tmp; npm needs a writable HOME.
      - /tmp:mode=1777,size=512m
      - /home/app:mode=0777,size=64m
    pids_limit: 1024
    # Substructure search over the CCD holds the result set in memory, and each
    # verifier thread carries its own OpenChemLib instance.
    mem_limit: ${PDB_API_MEMORY_LIMIT:-4g}
    memswap_limit: ${PDB_API_MEMORY_LIMIT:-4g}
    # Substructure search is CPU-bound: it parses and graph-matches every
    # candidate molecule, and openchemlib-sqlite sizes its verifier pool to the
    # cores this limit grants (availableParallelism() reads the cgroup quota).
    # Measured on 45k ligands: 1 core 28k candidates/s, 2 cores 61k/s, 4 cores
    # 99k/s, 8 cores 106k/s — so a low limit here directly shows up as a slow,
    # or timed-out, search. Lower it on a host that shares cores with the PyMOL
    # sync container.
    cpus: ${PDB_API_CPU_LIMIT:-8}
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.pdb.rule=Host(`pdb.cheminfo.org`)'
      - 'traefik.http.routers.pdb.entrypoints=websecure'
      - 'traefik.http.routers.pdb.tls.certresolver=letsencrypt'
      - 'traefik.http.services.pdb.loadbalancer.server.port=31015'
      - 'traefik.http.routers.pdb.middlewares=pdb-cors'
      - 'traefik.http.middlewares.pdb-cors.headers.accesscontrolalloworiginlist=*'
      - 'traefik.http.middlewares.pdb-cors.headers.accesscontrolallowheaders=Content-Type'
      - 'traefik.http.middlewares.pdb-cors.headers.accesscontrolmaxage=86400'
    # The CCD seed is owned by pdb-api-cron — pdb-api starts the API
    # immediately so Traefik never returns 502 during the first boot.
    command: npm run api

  pdb-api-cron:
    # healthcheck-ok: a cron worker: it refreshes the CCD and serves no HTTP to probe.
    # Periodically refreshes data/sqlite/db.sqlite from the wwPDB
    # Chemical Component Dictionary (weekly upstream cadence). Idle most
    # of the time, but the import phase synchronously parses ~40k CCD
    # entries through openchemlib and can briefly use >1 GiB of heap —
    # the generous mem_limit keeps it well clear of the OOM-killer.
    image: ${IMAGE_NAME:-ghcr.io/cheminfo/pdb.cheminfo.org}:${IMAGE_TAG:-latest}
    build: .
    volumes:
      - ./data:/app/data:z
    env_file:
      - path: .env
        required: false
    environment:
      DEBUG: '*'
      NODE_OPTIONS: '--max-old-space-size=6144'
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Same root-then-gosu entrypoint as node-pdb-sync (see above).
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /home/app:mode=0777,size=64m
    pids_limit: 1024
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 2
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    command: npm run cron-ccd

networks:
  traefik:
    external: true
